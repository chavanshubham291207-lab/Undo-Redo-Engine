<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Undo–Redo Engine | Stack Visualizer</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "secondary-fixed-dim": "var(--secondary-fixed-dim)",
            "surface-bright": "var(--surface-bright)",
            "on-surface-variant": "var(--on-surface-variant)",
            "tertiary": "var(--tertiary)",
            "tertiary-container": "var(--tertiary-container)",
            "surface-container": "var(--surface-container)",
            "on-surface": "var(--on-surface)",
            "error-container": "var(--error-container)",
            "surface-dim": "var(--surface-dim)",
            "on-primary": "var(--on-primary)",
            "on-background": "var(--on-surface)",
            "surface-container-highest": "var(--surface-container-highest)",
            "surface-container-lowest": "var(--surface-container-lowest)",
            "outline-variant": "var(--outline-variant)",
            "primary-container": "var(--primary-container)",
            "primary-fixed-dim": "var(--primary-fixed-dim)",
            "secondary": "var(--secondary)",
            "background": "var(--bg-app)",
            "surface": "var(--bg-app)",
            "surface-variant": "var(--surface-container-highest)",
            "outline": "var(--outline)",
            "on-error-container": "var(--on-error-container)",
            "primary": "var(--primary)",
            "surface-container-low": "var(--surface-container-low)",
            "surface-container-high": "var(--surface-container-high)",
            "error": "var(--error)"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          spacing: {
            "space-xl": "2.5rem",
            "space-md": "1rem",
            "space-sm": "0.5rem",
            "gutter-desktop": "1.5rem",
            "margin": "1rem",
            "space-xs": "0.25rem",
            "gutter": "1rem",
            "space-lg": "1.5rem",
            "margin-desktop": "2rem"
          },
          fontFamily: {
            "headline-lg-mobile": ["Geist", "sans-serif"],
            "body-sm": ["Geist", "sans-serif"],
            "body-lg": ["Geist", "sans-serif"],
            "label-md": ["JetBrains Mono", "monospace"],
            "headline-sm": ["Geist", "sans-serif"],
            "code-lg": ["JetBrains Mono", "monospace"],
            "code-sm": ["JetBrains Mono", "monospace"],
            "label-xs": ["JetBrains Mono", "monospace"],
            "headline-lg": ["Geist", "sans-serif"],
            "display-lg": ["Geist", "sans-serif"],
            "body-md": ["Geist", "sans-serif"]
          },
          fontSize: {
            "headline-lg-mobile": ["24px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "body-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "400" }],
            "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }],
            "label-md": ["11px", { lineHeight: "16px", letterSpacing: "0.06em", fontWeight: "500" }],
            "headline-sm": ["20px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "code-lg": ["14px", { lineHeight: "22px", letterSpacing: "-0.01em", fontWeight: "500" }],
            "code-sm": ["12px", { lineHeight: "18px", letterSpacing: "0em", fontWeight: "400" }],
            "label-xs": ["9px", { lineHeight: "12px", letterSpacing: "0.08em", fontWeight: "600" }],
            "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "600" }],
            "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.03em", fontWeight: "700" }],
            "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }]
          }
        }
      }
    };
  </script>
  <style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
        background-color: var(--bg-app);
        color: var(--on-surface);
        overflow-x: hidden;
        transition: background-color 0.25s ease, color 0.25s ease;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-app);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--surface-container-high);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--surface-bright);
    }
  </style>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
